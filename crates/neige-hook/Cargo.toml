[package]
name = "neige-hook"
version = "0.1.0"
edition = "2024"

[dependencies]
# Blocking client, no TLS: this binary is spawned once per hook and only ever
# talks to neige over loopback HTTP, so startup cost matters and a TLS stack
# would be dead weight.
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
